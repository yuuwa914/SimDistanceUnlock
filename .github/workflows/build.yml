name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: Find NDK and tools
        run: |
          set -eux
          NDK="${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            NDK="$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/ndk/* | sort -V | tail -n1)"
          fi
          test -f "$NDK/build/cmake/android.toolchain.cmake"
          echo "NDK=$NDK" >> "$GITHUB_ENV"
          cmake --version
          which ninja || sudo apt-get install -y ninja-build
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j
      - name: Package .levipack
        run: |
          SO="$(find build -name libSimDistanceUnlock.so | head -n1)"
          test -n "$SO"
          mkdir -p dist/pkg
          cp "$SO" dist/pkg/libSimDistanceUnlock.so
          cp manifest.json dist/pkg/
          (cd dist/pkg && zip -X ../SimDistanceUnlock.levipack manifest.json libSimDistanceUnlock.so)
      - uses: actions/upload-artifact@v4
        with:
          name: SimDistanceUnlock-levipack
          path: dist/SimDistanceUnlock.levipack
